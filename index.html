<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/argentum-app-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/argentum-app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" id="meta-color-scheme" />
    <!-- Apple Web App & Status Bar Seamless Integration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" id="meta-apple-status-bar" />
    <meta name="apple-mobile-web-app-title" content="Argentum" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#FAF7F2" id="meta-theme-color-default" />
    <link rel="manifest" href="/manifest.json" />
    <title>Argentum</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('argentum_theme');
          var isDark = saved === 'dark';
          var color = isDark ? '#060B14' : '#FAF7F2';
          var scheme = isDark ? 'dark' : 'light';

          if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.removeAttribute('data-theme');
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.style.colorScheme = scheme;
          document.documentElement.style.backgroundColor = color;
          if (document.body) {
            document.body.style.backgroundColor = color;
          }

          var csMeta = document.getElementById('meta-color-scheme');
          if (csMeta) csMeta.setAttribute('content', scheme);

          var appleStatus = document.getElementById('meta-apple-status-bar');
          if (appleStatus) appleStatus.setAttribute('content', isDark ? 'black-translucent' : 'default');

          var metas = document.querySelectorAll('meta[name="theme-color"]');
          metas.forEach(function(m) {
            m.setAttribute('content', color);
            m.removeAttribute('media');
          });
        } catch (e) {}
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #FAF7F2;
        color-scheme: light;
        min-height: 100%;
      }
      html.dark, html[data-theme="dark"], html.dark body, html[data-theme="dark"] body {
        background-color: #060B14 !important;
        color-scheme: dark !important;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script id="cf-turnstile-script" src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
